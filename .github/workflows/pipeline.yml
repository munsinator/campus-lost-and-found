name: Lost & Found Pipeline
#run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on: push

# Keep the whole production pipeline sequential, including the test/switch job.
# A newer push must not interrupt an EC2 command that is still running.
concurrency:
  group: lost-and-found-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan dependencies with Snyk
        uses: snyk/actions/node@v1.0.0
        with:
          args: --dev
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Scan code with Snyk
        uses: snyk/actions/node@v1.0.0
        with:
          command: code test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Scan with SonarQube
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  test:
    name: Testing
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: coverage/

  build:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/deploy/production'
    name: Building the app
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t lost-and-found-api:${{ github.run_number }} .

      - name: Save Docker image
        if: github.ref == 'refs/heads/deploy/production'
        run: docker save -o image.tar lost-and-found-api:${{ github.run_number }}

      - name: Upload Docker image
        if: github.ref == 'refs/heads/deploy/production'
        uses: actions/upload-artifact@v4
        with:
          name: lost-and-found-api-image
          path: image.tar
          if-no-files-found: error
          retention-days: 1

  deliver:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/deploy/production'

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: lost-and-found-api-image

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Login to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Tag Docker image
        run: |
          docker tag lost-and-found-api:${{ github.run_number }} "$DOCKERHUB_USERNAME/lost-and-found-api:${{ github.run_number }}"

      - name: Push Docker image
        run: docker push "$DOCKERHUB_USERNAME/lost-and-found-api:${{ github.run_number }}"

  deploy:
    name: Deploy inactive colour
    runs-on: ubuntu-latest
    needs: deliver
    if: github.ref == 'refs/heads/deploy/production'
    env:
      EC2_INSTANCE_ID: '${{ secrets.EC2_INSTANCE_ID }}'
      IMAGE_TAG: '${{ github.run_number }}'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          aws-access-key-id: '${{ secrets.AWS_ACCESS_KEY_ID }}'
          aws-secret-access-key: '${{ secrets.AWS_SECRET_ACCESS_KEY }}'
          aws-session-token: '${{ secrets.AWS_SESSION_TOKEN }}'
          aws-region: us-east-1

      - name: Send commands to EC2
        id: ssm
        env:
          EC2_COMMANDS: |
            cd /home/ubuntu/lost-and-found

            # Blue aktiv? Dann Green aktualisieren. Sonst umgekehrt.
            if grep -q 'proxy_pass http://127.0.0.1:3000;' /etc/nginx/sites-available/default; then
              COLOR=green
              VARIABLE=GREEN_IMAGE_TAG
            elif grep -q 'proxy_pass http://127.0.0.1:3001;' /etc/nginx/sites-available/default; then
              COLOR=blue
              VARIABLE=BLUE_IMAGE_TAG
            else
              echo 'Nginx muss auf Port 3000 oder 3001 zeigen'
              exit 1
            fi

            sed -i "s/^$VARIABLE=.*/$VARIABLE=$TAG/" .env
            docker compose pull "$COLOR"
            docker compose up -d --no-deps "$COLOR"
            echo "$COLOR" > ".deploy-$TAG"
            echo "Version $TAG auf $COLOR gestartet. Nginx bleibt unveraendert."
        run: |
          # jq verpackt die Befehle als JSON fuer AWS.
          jq -n --arg commands "$EC2_COMMANDS" --arg tag "$IMAGE_TAG" \
            '{commands: [("set -eu\nTAG=" + $tag + "\n" + $commands)], executionTimeout: ["90"]}' > commands.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" --document-name AWS-RunShellScript \
            --parameters file://commands.json --query Command.CommandId --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for EC2 result
        env:
          COMMAND_ID: '${{ steps.ssm.outputs.command_id }}'
        run: aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"

      - name: Show EC2 result
        if: always() && steps.ssm.outputs.command_id != ''
        env:
          COMMAND_ID: '${{ steps.ssm.outputs.command_id }}'
        run: |
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'

  e2e-and-performance:
    name: Run k6 tests
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/deploy/production'
    env:
      EC2_INSTANCE_ID: '${{ secrets.EC2_INSTANCE_ID }}'
      IMAGE_TAG: '${{ github.run_number }}'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          aws-access-key-id: '${{ secrets.AWS_ACCESS_KEY_ID }}'
          aws-secret-access-key: '${{ secrets.AWS_SECRET_ACCESS_KEY }}'
          aws-session-token: '${{ secrets.AWS_SESSION_TOKEN }}'
          aws-region: us-east-1

      - name: Send commands to EC2
        id: ssm
        env:
          EC2_COMMANDS: |
            cd /home/ubuntu/lost-and-found
            COLOR=$(cat ".deploy-$TAG")
            case "$COLOR" in
              blue) PORT=3000 ;;
              green) PORT=3001 ;;
              *) exit 1 ;;
            esac

            # Kurz warten, bis die neue API antwortet.
            curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 5 "http://127.0.0.1:$PORT/items/" -o /dev/null

            # Tests aus dem neuen Image verwenden.
            mkdir -p tests/k6
            CONTAINER=$(docker compose ps -q "$COLOR")
            docker cp "$CONTAINER:/app/src/tests/k6/." tests/k6/
            docker run --rm --network host -v "$PWD/tests/k6:/tests:ro" -e "BASE_URL=http://127.0.0.1:$PORT" grafana/k6:latest run /tests/smoke.ts
            docker run --rm --network host -v "$PWD/tests/k6:/tests:ro" -e "BASE_URL=http://127.0.0.1:$PORT" -e SEARCH_ENABLED=true grafana/k6:latest run /tests/e2e.ts
            docker run --rm --network host -v "$PWD/tests/k6:/tests:ro" -e "BASE_URL=http://127.0.0.1:$PORT" grafana/k6:latest run /tests/performance.ts

            echo "Tests fuer Version $TAG auf $COLOR erfolgreich. Manuell auf Port $PORT umschalten."
        run: |
          # jq verpackt die Befehle als JSON fuer AWS.
          jq -n --arg commands "$EC2_COMMANDS" --arg tag "$IMAGE_TAG" \
            '{commands: [("set -eu\nTAG=" + $tag + "\n" + $commands)], executionTimeout: ["90"]}' > commands.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" --document-name AWS-RunShellScript \
            --parameters file://commands.json --query Command.CommandId --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for EC2 result
        env:
          COMMAND_ID: '${{ steps.ssm.outputs.command_id }}'
        run: aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"

      - name: Show EC2 result
        if: always() && steps.ssm.outputs.command_id != ''
        env:
          COMMAND_ID: '${{ steps.ssm.outputs.command_id }}'
        run: |
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
