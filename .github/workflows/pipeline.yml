name: Lost & Found Pipeline
#run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on: push

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  test:
    name: Testing
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
  
  build:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/deploy/production'
    name: Building the app
    runs-on: ubuntu-latest
    needs: test
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
  
  deliver:
    if: github.ref == 'refs/heads/deploy/production'
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."

  deploy:
    if: github.ref == 'refs/heads/deploy/production'
    name: Deploy image to AWS
    runs-on: ubuntu-latest
    needs: deliver
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."

  e2e-and-performance:
    if: github.ref == 'refs/heads/deploy/production'
    name: E2E and performance tests against stagings
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."